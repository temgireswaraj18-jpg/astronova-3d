name: Build Astronova Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux System Dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            automake libltdl-dev patch lld

      - name: Install Buildozer & Cython
        run: |
          python3 -m pip install --upgrade "pip<25.0" setuptools wheel virtualenv
          python3 -m pip install buildozer "cython==0.29.36"

      - name: Build Debug APK
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log

      - name: Show the error (only runs if build fails)
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log > clean.log
          LINE=$(grep -n "# Command failed" clean.log | head -1 | cut -d: -f1)
          start=$(( LINE > 120 ? LINE - 120 : 1 ))
          sed -n "${start},${LINE}p" clean.log | cut -c1-300

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: astronova-debug-apk
          path: bin/*.apk
