name: Build Astronova Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (Required for python-for-android recipes)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17 (Official Android Gradle requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-v1-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v1-

      - name: Install Linux System Dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            automake libltdl-dev patch lld

      - name: Install Buildozer & Cython
        run: |
          python3 -m pip install --upgrade pip setuptools wheel virtualenv
          python3 -m pip install buildozer "cython==0.29.36"

      - name: Build Debug APK (For Phone Testing - Checklist #1)
        run: |
          yes | buildozer android debug

      - name: Upload Testable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astronova-debug-apk
          path: bin/*.apk

      - name: Build Release AAB (For Google Play Store - Checklist #3)
        run: |
          yes | buildozer android release

      - name: Upload Google Play Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astronova-release-aab
          path: bin/*.aab
