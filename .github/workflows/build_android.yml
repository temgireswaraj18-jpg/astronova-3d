name: Build Astronova Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux System Dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            automake libltdl-dev patch lld

      - name: Install Buildozer & Cython
        run: |
          python3 -m pip install --upgrade "pip<25.0" setuptools wheel virtualenv
          python3 -m pip install buildozer "cython==0.29.36"

      # Pass 1: lets buildozer download python-for-android, SDK and NDK.
      # It is EXPECTED to fail at the pip step, so errors are ignored here.
      - name: Build pass 1 (download tools, may fail)
        run: |
          buildozer android debug > build1.log 2>&1 || true

      # Patch python-for-android so the venv gets a clean pip
      - name: Patch python-for-android pip step
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('.buildozer/android/platform/python-for-android/pythonforandroid/build.py')
          s = p.read_text()
          old = 'pip install -U pip'
          new = ('rm -rf venv/lib/python3*/site-packages/pip venv/lib/python3*/site-packages/pip-* '
                 '&& curl -sSf -o /tmp/get-pip.py https://bootstrap.pypa.io/get-pip.py '
                 '&& python /tmp/get-pip.py')
          print('occurrences found:', s.count(old))
          assert old in s, 'pattern not found in build.py'
          p.write_text(s.replace(old, new))
          PY
          grep -n "get-pip" .buildozer/android/platform/python-for-android/pythonforandroid/build.py

      - name: Build Debug APK (pass 2)
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log

      - name: Show the error (only runs if build fails)
        if: failure()
        run: |
          for f in build.log build1.log; do [ -f "$f" ] && sed 's/\x1b\[[0-9;]*m//g' "$f" > "clean_$f"; done
          F=clean_build.log; [ -f "$F" ] || F=clean_build1.log
          LINE=$(grep -n "# Command failed" "$F" | head -1 | cut -d: -f1)
          if [ -z "$LINE" ]; then
            tail -n 150 "$F" | cut -c1-300
          else
            start=$(( LINE > 120 ? LINE - 120 : 1 ))
            sed -n "${start},${LINE}p" "$F" | cut -c1-300
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: astronova-debug-apk
          path: bin/*.apk
